# The debug/review gates assemble an APK, a CycloneDX SBOM and the R8/D8 dex
# merges in a single daemon. At -Xmx2g the external-dependency dex merge sat on
# the heap edge and failed once on CI with java.lang.OutOfMemoryError (run
# 34494819391, tasks :app-android:collectReviewDependencies and
# :app-android:mergeExtDexReview). The verification steps are unchanged; only the
# daemon heap limit moves, which keeps those steps runnable without narrowing them.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.incremental=true
systemProp.https.protocols=TLSv1.2,TLSv1.3
systemProp.http.keepAlive=true
