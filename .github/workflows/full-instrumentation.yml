name: full-instrumentation
on:
  schedule:
    - cron: '30 18 * * 1,3,5'
  pull_request:
    paths:
      - 'app-android/src/main/kotlin/runtime/mobileagent/privileged/**'
      - 'app-android/src/main/kotlin/runtime/mobileagent/integration/**'
      - 'app-android/src/main/kotlin/runtime/mobileagent/security/**'
      - 'app-android/src/main/kotlin/runtime/mobileagent/tooling/**'
      - 'app-android/src/main/kotlin/runtime/mobileagent/RunCoordinator.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/RunTools.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/BoundToolExecutor.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatExecutionController.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatRuntimeEvents.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatToolApprovalRequest.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatApprovalOutcome.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatRootPreflight.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ConfirmedDeviceActionCancellation.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatRun*'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatKnowledgePreparation.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ChatViewModel.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/ExecutionAuthorities.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/shizuku/**'
      - 'app-android/src/main/kotlin/runtime/mobileagent/wired/**'
      - 'app-android/src/main/kotlin/runtime/mobileagent/resident/**'
      - 'platform/android/security/**'
      - 'app-android/src/main/kotlin/runtime/mobileagent/MobileAgentApp.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/HostStartup*'
      - 'app-android/src/main/kotlin/runtime/mobileagent/HostInitialization.kt'
      - 'app-android/src/main/kotlin/runtime/mobileagent/DatabaseRecoveryStore.kt'
      - 'data/sqlite/src/main/kotlin/runtime/mobileagent/data/*Migration*'
      - 'data/sqlite/src/main/kotlin/runtime/mobileagent/data/migrations/**'
      - 'data/sqlite/src/main/kotlin/runtime/mobileagent/data/Root*'
      - 'data/sqlite/src/main/kotlin/runtime/mobileagent/data/RunRepository.kt'
      - 'data/sqlite/src/main/kotlin/runtime/mobileagent/data/AuthorityRepository.kt'
      - 'data/sqlite/src/main/kotlin/runtime/mobileagent/data/Knowledge*'
      - 'tools/instrumentation-suites.json'
      - 'tools/verify_test_selection.py'
      - 'tools/run-device-suite'
      - '.github/workflows/full-instrumentation.yml'
  workflow_dispatch:
    inputs:
      suite:
        description: Automated suite (heavy scale measurements remain explicit)
        type: choice
        options: [nightly, performance, full]
        default: nightly
      variant:
        description: Use review for authority and recovery evidence
        type: choice
        options: [Debug, Review]
        default: Debug

permissions:
  contents: read
concurrency:
  group: full-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-device:
    name: Full automated instrumentation (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Verify explicit instrumentation inventory
        run: |
          chmod +x gradlew
          python -m pip install "pyyaml==6.0.2"
          python tools/verify_test_selection.py
          python tools/test_verify_test_selection.py
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: All explicitly mapped automated device classes
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          script: |
            timeout 120 sh -c 'until adb -s "emulator-${EMULATOR_PORT:-5554}" shell service check package 2>/dev/null | grep -q "found"; do sleep 2; done'
            bash tools/run-device-suite '${{ github.event_name == 'pull_request' && 'recovery' || inputs.suite || 'nightly' }}' '${{ github.event_name == 'pull_request' && 'Review' || inputs.variant || 'Debug' }}'
      - name: Device result and explicit skip summary
        if: always()
        run: python tools/verify_test_selection.py --summary app-android/build/reports/device-evidence/ >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full device results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: instrumentation-${{ github.event_name == 'pull_request' && 'recovery' || inputs.suite || 'nightly' }}-${{ github.event_name == 'pull_request' && 'Review' || inputs.variant || 'Debug' }}-${{ github.run_attempt }}
          path: |
            app-android/build/reports/device-evidence/
            app-android/build/outputs/androidTest-results/connected/
            app-android/build/reports/androidTests/connected/
