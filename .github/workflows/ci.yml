name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Run the formally signed release gate using configured repository secrets
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            **/*.lockfile
            **/verification-metadata.xml
            gradle/wrapper/gradle-wrapper.properties
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
      - name: Announcement worker tests
        working-directory: services/announcements
        run: |
          npm ci
          npm test
      - name: licenseGuard
        run: ./gradlew licenseGuard licenseGuardReverse --no-daemon
      - name: REUSE
        run: |
          python -m pip install "reuse==6.2.0"
          python -m reuse lint
      - name: Verify CI pins, dependency locks and checksums
        run: ./gradlew verifyCiPins verifyDependencyLock verifyDependencyVerification --dependency-verification=strict --no-daemon
      - name: Verify workflow YAML syntax
        run: |
          python -m pip install "pyyaml==6.0.2"
          ./gradlew verifyWorkflowYaml --dependency-verification=strict --no-daemon
      - name: Verify instrumentation selection and regression fixtures
        run: |
          python tools/verify_test_selection.py
          python tools/test_verify_test_selection.py
          python tools/verify_module_boundaries.py
          python tools/test_verify_module_boundaries.py
          python tools/verify_complexity.py
          python tools/test_verify_complexity.py
          python tools/test_verify_lint_warnings.py
          python -B tools/verify_i18n.py
          python -B tools/test_verify_i18n.py
      - name: Native page alignment checker regression tests
        run: python tools/test_verify_native_alignment.py
      - name: Packaged notice inventory regression tests
        run: python tools/test_runtime_notices.py
      - name: Unit tests and Android debug APK/SBOM
        run: ./gradlew debugEvidenceGate --dependency-verification=strict --no-daemon
      - name: Upload debug artifact evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: debug-evidence
          path: |
            app-android/build/reports/sbom/debug.cdx.json
            app-android/build/reports/provenance/debug.provenance.json

      - name: Review-like non-debuggable APK/SBOM/provenance gate
        run: ./gradlew reviewGate --dependency-verification=strict --no-daemon
      - name: Upload review security evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: review-security-evidence
          path: |
            app-android/build/outputs/apk/review/*.apk
            app-android/build/reports/sbom/review.cdx.json
            app-android/build/reports/provenance/review.provenance.json
            app-android/build/reports/apk-size/review.json

  android-smoke:
    name: Android UI smoke (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 34, 35, 36]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Provider/navigation/import/announcement client smoke
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # avdmanager device IDs are case-sensitive; current SDK tools expose pixel_2.
          profile: pixel_2
          # KVM is enabled above; -accel on makes missing acceleration a hard failure.
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          script: |
            timeout 120 sh -c 'until adb -s "emulator-${EMULATOR_PORT:-5554}" shell service check package 2>/dev/null | grep -q "found"; do sleep 2; done'
            ./gradlew :app-android:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=runtime.mobileagent.ReleaseGateUiDeviceTest,runtime.mobileagent.ChatReplyPresentationUiTest,runtime.mobileagent.AppLocalizedResourcesDeviceTest" --dependency-verification=strict --no-daemon

  convergence-device:
    name: Convergence device tests (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Replay, workspace no-replace and native index lifecycle tests
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          # avdmanager device IDs are case-sensitive; current SDK tools expose pixel_2.
          profile: pixel_2
          # KVM is enabled above; -accel on makes missing acceleration a hard failure.
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          script: |
            timeout 120 sh -c 'until adb -s "emulator-${EMULATOR_PORT:-5554}" shell service check package 2>/dev/null | grep -q "found"; do sleep 2; done'
            ./gradlew :app-android:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=runtime.mobileagent.RunToolsReplayDeviceTest,runtime.mobileagent.shizuku.ShizukuWorkspaceFileStoreTest,runtime.mobileagent.VectorIndexCacheDeviceTest,runtime.mobileagent.ChatContextCompactionDeviceTest,runtime.mobileagent.ContextCompactionUiTest,runtime.mobileagent.ChatInputBudgetDeviceTest,runtime.mobileagent.ChatVisualTransferDeviceTest,runtime.mobileagent.AgentsConversationRoutingDeviceTest,runtime.mobileagent.TransferArchiveDeviceTest,runtime.mobileagent.ThirdPartyNoticesDeviceTest,runtime.mobileagent.workspace.WorkspaceBackendTest,runtime.mobileagent.PythonModelInvokeBrokerTest,runtime.mobileagent.SkillGrantScopeUiTest,runtime.mobileagent.KnowledgeStorageUiDeviceTest,runtime.mobileagent.storage.BundledSqliteReliabilityTest,runtime.mobileagent.AgentsGrantUiTest,runtime.mobileagent.ExecutionAuthoritiesTest,runtime.mobileagent.ExecutionAuthoritiesUiTest,runtime.mobileagent.WebSearchPermissionDeviceTest,runtime.mobileagent.diagnostics.DiagnosticsDeviceTest,runtime.mobileagent.DiagnosticsLogLevelUiTest,runtime.mobileagent.DisabledSkillBindingUiTest,runtime.mobileagent.tooling.EffectiveCapabilityResolverHotUpdateTest,runtime.mobileagent.tooling.ToolingOrchestrationTest,runtime.mobileagent.RuntimeSafToolExposureDeviceTest,runtime.mobileagent.security.AndroidSecretStoreDeviceTest" --dependency-verification=strict --no-daemon
    # No continue-on-error: a red convergence job blocks the commit.

  knowledge-pipeline-device:
    name: Document pipeline device tests (API 36, synthetic only)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Unit rendering, memory lifecycle, progress and recovery UI
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          script: |
            timeout 120 sh -c 'until adb -s "emulator-${EMULATOR_PORT:-5554}" shell service check package 2>/dev/null | grep -q "found"; do sleep 2; done'
            ./gradlew :app-android:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=runtime.mobileagent.DocumentUnitRenderDeviceTest,runtime.mobileagent.KnowledgeBatchUiDeviceTest,runtime.mobileagent.KnowledgeVisionStateDeviceTest,runtime.mobileagent.KnowledgeStagingDeviceTest,runtime.mobileagent.KnowledgeImportLifecycleTest" --dependency-verification=strict --no-daemon
      - name: Upload pipeline device results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: knowledge-pipeline-device-results
          path: app-android/build/outputs/androidTest-results/connected/

  release:
    name: Signed release gate (manual only)
    if: github.event_name == 'workflow_dispatch' && inputs.signed_release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Install workflow validation dependency
        run: python -m pip install "pyyaml==6.0.2"
      - name: Run signed release gate
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_RELEASE_KEYSTORE="$RUNNER_TEMP/android-release.jks"
          trap 'rm -f -- "$ANDROID_RELEASE_KEYSTORE"' EXIT
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          umask 077
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_RELEASE_KEYSTORE"
          unset ANDROID_RELEASE_KEYSTORE_BASE64
          ./gradlew releaseGate --dependency-verification=strict --no-daemon
      - name: Remove temporary signing input
        if: always()
        shell: bash
        run: rm -f -- "$RUNNER_TEMP/android-release.jks"
      - name: Upload signed APK, SBOM and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-gate-${{ github.sha }}
          path: |
            app-android/build/outputs/apk/release/*.apk
            app-android/build/reports/sbom/release.cdx.json
            app-android/build/reports/provenance/release.provenance.json
