<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" style="background:#111827; font-family:Roboto, sans-serif;">
  <!-- Dark Status Bar -->
  <rect x="0" y="0" width="400" height="28" fill="#1F2937"/>
  <text x="16" y="18" font-size="11" fill="#9CA3AF" font-weight="600">12:00</text>
  <text x="260" y="18" font-size="11" fill="#9CA3AF" font-weight="600">License: AGPL-3.0</text>
  <line x1="0" y1="28" x2="400" y2="28" stroke="#374151" stroke-width="1"/>

  <!-- Top App Bar -->
  <rect x="0" y="28" width="400" height="56" fill="#1F2937"/>
  <text x="16" y="62" font-size="16" fill="#F9FAFB" font-weight="700">Settings &amp; About</text>
  <line x1="0" y1="84" x2="400" y2="84" stroke="#374151" stroke-width="1"/>

  <!-- Section 1: Privacy Preferences -->
  <rect x="16" y="96" width="368" height="150" rx="10" fill="#1F2937" stroke="#374151"/>
  <text x="28" y="122" font-size="12" fill="#76A9FA" font-weight="700">PRIVACY &amp; TELEMETRY</text>

  <!-- Toggle 1: Anonymous Analytics -->
  <text x="28" y="148" font-size="12" fill="#F9FAFB" font-weight="500">Anonymous Announcement Metrics</text>
  <text x="28" y="166" font-size="10" fill="#9CA3AF">Disabled by default. No personal data or query traces sent.</text>
  <rect x="314" y="142" width="44" height="22" rx="11" fill="#374151"/>
  <circle cx="325" cy="153" r="8" fill="#9CA3AF"/>

  <!-- Toggle 2: Request Inspector Default -->
  <text x="28" y="196" font-size="12" fill="#F9FAFB" font-weight="500">Always Inspect Requests Before Sending</text>
  <text x="28" y="214" font-size="10" fill="#9CA3AF">Prompts review drawer before outbound BYOK API call.</text>
  <rect x="314" y="190" width="44" height="22" rx="11" fill="#233876"/>
  <circle cx="347" cy="201" r="8" fill="#76A9FA"/>

  <!-- Section 2: Data Backup & Migration -->
  <rect x="16" y="258" width="368" height="150" rx="10" fill="#1F2937" stroke="#374151"/>
  <text x="28" y="284" font-size="12" fill="#76A9FA" font-weight="700">DATA BACKUP &amp; MIGRATION</text>
  <text x="28" y="306" font-size="11" fill="#D1D5DB">Export Agents, Prompt History, and CAS Knowledge Bases.</text>
  <text x="28" y="324" font-size="10" fill="#31C48D">Security Guarantee: Export packages exclude Keystore credentials.</text>

  <rect x="28" y="344" width="104" height="28" rx="4" fill="#374151" stroke="#4B5563"/>
  <text x="40" y="362" font-size="11" fill="#F9FAFB">Export Data</text>

  <rect x="144" y="344" width="104" height="28" rx="4" fill="#374151" stroke="#4B5563"/>
  <text x="156" y="362" font-size="11" fill="#F9FAFB">Restore Data</text>

