name: license-guard

on:
  push:
  pull_request:

jobs:
  license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Grant wrapper execute permission
        run: chmod +x gradlew
      - name: licenseGuard
        run: ./gradlew licenseGuard licenseGuardReverse --no-daemon
      - name: REUSE
        run: |
          python -m pip install reuse
          python -m reuse lint
