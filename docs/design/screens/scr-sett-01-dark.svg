  <rect x="344" y="744" width="48" height="22" rx="4" fill="#233876"/>
  <text x="362" y="759" font-size="11" fill="#76A9FA" font-weight="700">[i]</text>
  <text x="352" y="784" font-size="10" fill="#76A9FA" font-weight="700">About</text>
