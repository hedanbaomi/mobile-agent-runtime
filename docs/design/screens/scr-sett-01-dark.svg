  <text x="28" y="512" font-size="11" fill="#9CA3AF">Git Revision: <tspan fill="#76A9FA" font-family="monospace">c9798dc336864a353cfe9c2b0edd7d16aa37769c</tspan></text>
  <text x="28" y="532" font-size="11" fill="#9CA3AF">Repository: <tspan fill="#F9FAFB">hedanbaomi/mobile-agent-runtime</tspan></text>
  <text x="28" y="552" font-size="11" fill="#9CA3AF">CODEOWNERS: <tspan fill="#F9FAFB">@hedanbaomi</tspan></text>

