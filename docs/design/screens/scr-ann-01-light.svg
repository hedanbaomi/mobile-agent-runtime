<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" style="background:#F9FAFB; font-family:Roboto, sans-serif;">
  <!-- Status Bar -->
  <rect x="0" y="0" width="400" height="28" fill="#FFFFFF"/>
  <text x="16" y="18" font-size="11" fill="#4B5563" font-weight="600">12:00</text>
  <text x="260" y="18" font-size="11" fill="#4B5563" font-weight="600">News Feed [Verified]</text>
  <line x1="0" y1="28" x2="400" y2="28" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Top App Bar -->
  <rect x="0" y="28" width="400" height="56" fill="#FFFFFF"/>
  <text x="16" y="62" font-size="16" fill="#111827" font-weight="700">Announcements</text>
  <rect x="290" y="42" width="94" height="28" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
  <text x="302" y="60" font-size="11" fill="#1F2A37" font-weight="500">Mark Read</text>
  <line x1="0" y1="84" x2="400" y2="84" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Announcement 1: Mandatory Security Notice -->
  <rect x="16" y="96" width="368" height="160" rx="10" fill="#FFFFFF" stroke="#E02424" stroke-width="1.5"/>
  <div style="display:flex;">
    <rect x="28" y="108" width="80" height="20" rx="4" fill="#FDE8E8"/>
    <text x="34" y="122" font-size="10" fill="#9B1C1C" font-weight="700">MANDATORY</text>
  </div>
  <text x="28" y="148" font-size="13" fill="#111827" font-weight="700">Security Patch v1.0.2 Notice</text>
  <text x="28" y="168" font-size="11" fill="#4B5563">Updated bundled SQLite driver to eliminate ABI vulnerabilities on Android API 26. Digital signature verified.</text>
  
  <text x="28" y="196" font-size="10" fill="#6B7280">Published: 2026-08-28 | Revision: 3 | ETag: "a81f-99"</text>
  <rect x="28" y="210" width="130" height="28" rx="4" fill="#1A56DB"/>
  <text x="38" y="228" font-size="11" fill="#FFFFFF" font-weight="600">Read &amp; Acknowledge</text>

  <!-- Announcement 2: Feature Announcement -->
  <rect x="16" y="268" width="368" height="130" rx="10" fill="#FFFFFF" stroke="#E5E7EB"/>
  <rect x="28" y="280" width="56" height="20" rx="4" fill="#E1EFFE"/>
  <text x="34" y="294" font-size="10" fill="#1E429F" font-weight="700">FEATURE</text>

  <text x="28" y="320" font-size="13" fill="#111827" font-weight="700">M0.5 UI Design Baseline Completed</text>
  <text x="28" y="340" font-size="11" fill="#4B5563">Comprehensive 7-category screen specifications and Material 3 design tokens are now available.</text>
  <text x="28" y="368" font-size="10" fill="#6B7280">Published: 2026-08-28 | Revision: 1 | Target: All</text>

  <!-- Modal Dialog Simulation (Ack Notice Dialog) -->
  <rect x="16" y="414" width="368" height="290" rx="12" fill="#FFFFFF" stroke="#1A56DB" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
  <rect x="16" y="414" width="368" height="32" rx="12" fill="#E1EFFE"/>
  <text x="28" y="435" font-size="12" fill="#1E429F" font-weight="700">[MANDATORY ACKNOWLEDGEMENT DIALOG]</text>

  <text x="28" y="468" font-size="12" fill="#111827" font-weight="700">Action Required: Acknowledge Security Update</text>
  <text x="28" y="490" font-size="11" fill="#374151">This critical update includes:</text>
  <text x="28" y="508" font-size="11" fill="#374151">1. Native FTS5 driver bundled in libsqliteJni.so;</text>
  <text x="28" y="526" font-size="11" fill="#374151">2. Android Keystore AES-GCM secret redactor;</text>
  <text x="28" y="544" font-size="11" fill="#374151">3. Automated CAS recovery on power outage.</text>

  <rect x="28" y="562" width="344" height="40" rx="4" fill="#F3F4F6"/>
  <text x="36" y="578" font-size="10" fill="#0E9F6E" font-weight="700">Digital Signature: Ed25519 Verified [Worker Origin]</text>
  <text x="36" y="594" font-size="9" fill="#6B7280" font-family="monospace">sig: 9f84b12c... / d1_snapshot_v3</text>

  <rect x="28" y="618" width="344" height="36" rx="6" fill="#1A56DB"/>
  <text x="74" y="641" font-size="12" fill="#FFFFFF" font-weight="700">I Have Read and Acknowledge</text>

  <text x="28" y="680" font-size="10" fill="#6B7280">Ack receipt is stored locally. Zero personal data uploaded.</text>

  <!-- Bottom Navigation Bar (7 tabs) -->
  <rect x="0" y="736" width="400" height="64" fill="#FFFFFF"/>
  <line x1="0" y1="736" x2="400" y2="736" stroke="#E5E7EB" stroke-width="1"/>
  <text x="22" y="759" font-size="11" fill="#6B7280">[C]</text>
  <text x="16" y="784" font-size="10" fill="#6B7280">Chat</text>
  <text x="76" y="759" font-size="11" fill="#6B7280">[A]</text>
  <text x="68" y="784" font-size="10" fill="#6B7280">Agents</text>
  <text x="132" y="759" font-size="11" fill="#6B7280">[P]</text>
  <text x="122" y="784" font-size="10" fill="#6B7280">Providers</text>
  <text x="188" y="759" font-size="11" fill="#6B7280">[K]</text>
  <text x="178" y="784" font-size="10" fill="#6B7280">Knowledge</text>
  <text x="248" y="759" font-size="11" fill="#6B7280">[S]</text>
  <text x="242" y="784" font-size="10" fill="#6B7280">Skills</text>

  <!-- Tab 6: News (Selected) -->
  <rect x="296" y="744" width="48" height="22" rx="4" fill="#E1EFFE"/>
  <text x="312" y="759" font-size="11" fill="#1A56DB" font-weight="700">[N]</text>
  <text x="302" y="784" font-size="10" fill="#1A56DB" font-weight="700">News</text>

  <text x="360" y="759" font-size="11" fill="#6B7280">[i]</text>
  <text x="354" y="784" font-size="10" fill="#6B7280">About</text>
</svg>
