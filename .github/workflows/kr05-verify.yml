name: KR05 isolated verification
on:
  push:
    branches: [codex/kr05-verify-20260920]
    paths: [.github/workflows/kr05-verify.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e57187c238bfd004d3e181dc5c64fc15c936d09f
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
      - name: Apply scoped fix to the pinned clean base
        env:
          KR05_PAYLOAD: 
        run: |
          git rev-parse --show-toplevel
          git status --short --branch
          test -z "$(git status --porcelain)"
          python - <<'PY'
          import os, json, gzip, base64, subprocess
          from pathlib import Path
          payload = json.loads(gzip.decompress(base64.b64decode(os.environ['KR05_PAYLOAD'])))
          for name, text in payload['files'].items():
              path = Path(name)
              assert not path.exists(), name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(text, encoding='utf-8')
          patch = Path(os.environ['RUNNER_TEMP']) / 'kr05-apply.py'
          patch.write_text(payload['patch'], encoding='utf-8')
          subprocess.run(['python',str(patch)],check=True)
          PY
          chmod +x gradlew
          mkdir -p build/kr05
          git diff --check
          git diff --stat | tee build/kr05/diff-stat.txt
      - name: Targeted regression including 50k fake API and existing UNKNOWN recovery
        run: |
          set -o pipefail
          ./gradlew :data:sqlite:test --tests runtime.mobileagent.data.EmbeddingLinearDispatchTest --tests runtime.mobileagent.data.KnowledgeReviewRegressionTest --dependency-verification=strict --no-daemon 2>&1 | tee build/kr05/targeted.log
      - name: Full pre-commit evidence and license gates
        run: |
          set -o pipefail
          python -m pip install "reuse==6.2.0" "pyyaml==6.0.2"
          ./gradlew licenseGuard licenseGuardReverse verifyCiPins verifyDependencyLock verifyDependencyVerification verifyWorkflowYaml debugEvidenceGate --dependency-verification=strict --no-daemon 2>&1 | tee build/kr05/gates.log
          python -m reuse lint | tee build/kr05/reuse.log
          git diff --check
      - name: Publish only validated source and tests to a separate branch
        run: |
          set -euo pipefail
          branch=codex/kr05-linear-dispatch-20260920
          test "$(git rev-parse HEAD)" = e57187c238bfd004d3e181dc5c64fc15c936d09f
          git switch -c "$branch"
          git add data/sqlite/src/main/kotlin/runtime/mobileagent/data/EmbeddingInputRevision.kt data/sqlite/src/main/kotlin/runtime/mobileagent/data/KnowledgeRepository.kt data/sqlite/src/main/kotlin/runtime/mobileagent/data/Migrations.kt data/sqlite/src/test/kotlin/runtime/mobileagent/data/EmbeddingLinearDispatchTest.kt data/sqlite/src/test/kotlin/runtime/mobileagent/data/DocumentPipelineTest.kt data/sqlite/src/test/kotlin/runtime/mobileagent/data/KnowledgeBatchStagingTest.kt
          test "$(git diff --cached --name-only | wc -l)" -eq 6
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m 'fix(knowledge): make API batch manifest validation linear' -m "Preserve live dispatch authorization and immutable successful caches. Validate the canonical manifest once per execution and use transactional per-KB source revisions between batches. Add 1k/10k/50k fake-API complexity, mutation, cross-connection and rollback regressions. Verified by KR05 isolated run $GITHUB_RUN_ID; no paid provider calls or release."
          git rev-parse HEAD | tee build/kr05/source-sha.txt
          git show --stat HEAD | tee build/kr05/commit.txt
          git push origin "HEAD:refs/heads/$branch"
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kr05-verification
          path: |
            build/kr05/
            data/sqlite/build/test-results/test/
            data/sqlite/src/main/kotlin/runtime/mobileagent/data/EmbeddingInputRevision.kt
            data/sqlite/src/main/kotlin/runtime/mobileagent/data/KnowledgeRepository.kt
            data/sqlite/src/main/kotlin/runtime/mobileagent/data/Migrations.kt
            data/sqlite/src/test/kotlin/runtime/mobileagent/data/EmbeddingLinearDispatchTest.kt
