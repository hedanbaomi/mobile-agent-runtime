name: full-instrumentation
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: full-instrumentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-device:
    name: Full automated instrumentation (API 36)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
      - name: Verify explicit instrumentation inventory
        run: |
          chmod +x gradlew
          python tools/verify_test_selection.py
          python tools/test_verify_test_selection.py
      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: All explicitly mapped automated device classes
        uses: reactivecircus/android-emulator-runner@324029e2f414c084d8b15ba075288885e74aef9c # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -accel on
          disable-animations: true
          script: |
            timeout 120 sh -c 'until adb -s "emulator-${EMULATOR_PORT:-5554}" shell service check package 2>/dev/null | grep -q "found"; do sleep 2; done'
            ./gradlew :app-android:connectedDebugAndroidTest "-Pandroid.testInstrumentationRunnerArguments.class=$(python tools/verify_test_selection.py --suite full)" --dependency-verification=strict --no-daemon
      - name: Device result and explicit skip summary
        if: always()
        run: python tools/verify_test_selection.py --summary app-android/build/outputs/androidTest-results/connected/ >> "$GITHUB_STEP_SUMMARY"
      - name: Upload full device results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-instrumentation-results
          path: app-android/build/outputs/androidTest-results/connected/
