  <text x="178" y="784" font-size="10" fill="#9CA3AF">Knowledge</text>
  <text x="248" y="759" font-size="11" fill="#9CA3AF">[S]</text>
  <text x="242" y="784" font-size="10" fill="#9CA3AF">Skills</text>
