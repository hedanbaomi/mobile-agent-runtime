<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 800" width="400" height="800" style="background:#111827; font-family:Roboto, sans-serif;">
  <!-- Dark Status Bar -->
  <rect x="0" y="0" width="400" height="28" fill="#1F2937"/>
  <text x="16" y="18" font-size="11" fill="#9CA3AF" font-weight="600">12:00</text>
  <text x="260" y="18" font-size="11" fill="#9CA3AF" font-weight="600">Sandbox: Isolated Process</text>
  <line x1="0" y1="28" x2="400" y2="28" stroke="#374151" stroke-width="1"/>

  <!-- Top App Bar -->
  <rect x="0" y="28" width="400" height="56" fill="#1F2937"/>
  <text x="16" y="62" font-size="16" fill="#F9FAFB" font-weight="700">Skills &amp; Sandbox</text>
  <rect x="300" y="42" width="84" height="28" rx="6" fill="#76A9FA"/>
  <text x="314" y="60" font-size="11" fill="#1E429F" font-weight="700">[+] Install</text>
  <line x1="0" y1="84" x2="400" y2="84" stroke="#374151" stroke-width="1"/>

  <!-- Skill 1: skill_calculator -->
  <rect x="16" y="96" width="368" height="240" rx="10" fill="#1F2937" stroke="#374151"/>
  <text x="28" y="122" font-size="14" fill="#F9FAFB" font-weight="700">skill_calculator v1.0.0</text>
  <rect x="234" y="108" width="136" height="20" rx="4" fill="#233876"/>
  <text x="242" y="122" font-size="10" fill="#E1EFFE" font-weight="700">ISOLATED CPYTHON</text>

  <text x="28" y="146" font-size="11" fill="#D1D5DB">Mathematical formula evaluation and matrix operations.</text>
  <text x="28" y="166" font-size="10" fill="#9CA3AF">Timeout Cap: <tspan fill="#F9FAFB">5000ms</tspan> | Memory Cap: <tspan fill="#F9FAFB">64 MB</tspan> | License: <tspan fill="#76A9FA">AGPL-3.0-only</tspan></text>

  <!-- Security Manifest -->
  <rect x="28" y="178" width="344" height="60" rx="4" fill="#111827" stroke="#374151"/>
  <text x="36" y="196" font-size="10" fill="#76A9FA" font-weight="700">Capability Broker Permissions:</text>
  <text x="36" y="214" font-size="10" fill="#9CA3AF">Network: <tspan fill="#F98080">NONE (Blocked)</tspan> | File System: <tspan fill="#F98080">NONE (Blocked)</tspan></text>
  <text x="36" y="228" font-size="10" fill="#31C48D">IPC Bridge: Android ParcelFileDescriptor only</text>

  <!-- Actions -->
  <rect x="28" y="250" width="94" height="26" rx="4" fill="#374151" stroke="#4B5563"/>
  <text x="40" y="267" font-size="10" fill="#F9FAFB">View Source</text>

  <rect x="130" y="250" width="104" height="26" rx="4" fill="#374151" stroke="#4B5563"/>
  <text x="142" y="267" font-size="10" fill="#F9FAFB">Permission Grid</text>

  <rect x="242" y="250" width="70" height="26" rx="4" fill="#771D1D" stroke="#F98080"/>
  <text x="256" y="267" font-size="10" fill="#F98080">Revoke</text>

  <!-- Execution Audit Log Card -->
  <rect x="16" y="348" width="368" height="260" rx="10" fill="#1F2937" stroke="#374151"/>
  <text x="28" y="372" font-size="12" fill="#76A9FA" font-weight="700">Tool Execution Audit Log</text>
  <text x="28" y="390" font-size="10" fill="#9CA3AF">Audit events stored locally; zero unredacted secret retention.</text>

  <!-- Audit Table -->
  <rect x="28" y="400" width="344" height="24" fill="#111827"/>
  <text x="34" y="416" font-size="10" fill="#9CA3AF" font-weight="700">Timestamp</text>
  <text x="120" y="416" font-size="10" fill="#9CA3AF" font-weight="700">Invocation ID</text>
  <text x="230" y="416" font-size="10" fill="#9CA3AF" font-weight="700">Outcome</text>
  <text x="320" y="416" font-size="10" fill="#9CA3AF" font-weight="700">Latency</text>

  <!-- Log Row 1 -->
  <line x1="28" y1="424" x2="372" y2="424" stroke="#374151"/>
  <text x="34" y="442" font-size="10" fill="#D1D5DB">12:01:04</text>
  <text x="120" y="442" font-size="10" fill="#D1D5DB" font-family="monospace">inv_8f21a</text>
  <text x="230" y="442" font-size="10" fill="#31C48D">[SUCCESS]</text>
  <text x="320" y="442" font-size="10" fill="#D1D5DB">142ms</text>

  <!-- Log Row 2 -->
  <line x1="28" y1="454" x2="372" y2="454" stroke="#374151"/>
  <text x="34" y="472" font-size="10" fill="#D1D5DB">11:45:20</text>
  <text x="120" y="472" font-size="10" fill="#D1D5DB" font-family="monospace">inv_7a09c</text>
  <text x="230" y="472" font-size="10" fill="#FACA15">[REJECTED]</text>
  <text x="320" y="472" font-size="10" fill="#9CA3AF">-</text>

  <!-- Log Row 3 -->
  <line x1="28" y1="484" x2="372" y2="484" stroke="#374151"/>
  <text x="34" y="502" font-size="10" fill="#D1D5DB">10:12:08</text>
  <text x="120" y="502" font-size="10" fill="#D1D5DB" font-family="monospace">inv_6b44e</text>
  <text x="230" y="502" font-size="10" fill="#F98080">[TIMEOUT]</text>
  <text x="320" y="502" font-size="10" fill="#D1D5DB">5000ms</text>

  <!-- Isolation Guarantees -->
  <rect x="16" y="620" width="368" height="96" rx="10" fill="#233876"/>
  <text x="28" y="642" font-size="11" fill="#E1EFFE" font-weight="700">Process Lifecycle Boundary</text>
  <text x="28" y="660" font-size="10" fill="#E1EFFE">- Every invocation runs in a fresh CPython runtime instance.</text>
  <text x="28" y="676" font-size="10" fill="#E1EFFE">- Isolated process is killed upon completion; no state leakage.</text>
  <text x="28" y="692" font-size="10" fill="#E1EFFE">- Native wheels (.so) and pip commands are strictly banned.</text>

  <!-- Bottom Navigation Bar (7 tabs) -->
  <rect x="0" y="736" width="400" height="64" fill="#1F2937"/>
  <line x1="0" y1="736" x2="400" y2="736" stroke="#374151" stroke-width="1"/>
  <text x="22" y="759" font-size="11" fill="#9CA3AF">[C]</text>
  <text x="16" y="784" font-size="10" fill="#9CA3AF">Chat</text>
  <text x="76" y="759" font-size="11" fill="#9CA3AF">[A]</text>
  <text x="68" y="784" font-size="10" fill="#9CA3AF">Agents</text>
  <text x="132" y="759" font-size="11" fill="#9CA3AF">[P]</text>
  <text x="122" y="784" font-size="10" fill="#9CA3AF">Providers</text>
  <text x="188" y="759" font-size="11" fill="#9CA3AF">[K]</text>
  <text x="178" y="784" font-size="10" fill="#9CA3AF">Knowledge</text>

  <!-- Tab 5: Skills (Selected) -->
  <rect x="236" y="744" width="48" height="22" rx="4" fill="#233876"/>
  <text x="254" y="759" font-size="11" fill="#76A9FA" font-weight="700">[S]</text>
  <text x="242" y="784" font-size="10" fill="#76A9FA" font-weight="700">Skills</text>

  <text x="306" y="759" font-size="11" fill="#9CA3AF">[N]</text>
  <text x="302" y="784" font-size="10" fill="#9CA3AF">News</text>
  <text x="360" y="759" font-size="11" fill="#9CA3AF">[i]</text>
  <text x="354" y="784" font-size="10" fill="#9CA3AF">About</text>
</svg>
